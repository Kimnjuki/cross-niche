# Build and publish
[build]
  publish = "dist"
  command = "npm run build"

# 301 redirect: www to non-www (avoids duplicate content)
[[redirects]]
  from = "https://www.thegridnexus.com/*"
  to = "https://thegridnexus.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.thegridnexus.com/*"
  to = "https://thegridnexus.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://thegridnexus.com/*"
  to = "https://thegridnexus.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/article/ulse/nexus-pulse"
